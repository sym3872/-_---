<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050609">
  <title>Antigravity CLI — Bloom cursor</title>
  <link rel="stylesheet" href="anti.css">
</head>
<body>
  <canvas id="bloom-canvas" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <main class="shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="copy">
        <p class="eyebrow">Developer tools, unbound</p>
        <h1 id="page-title">Install Google Antigravity CLI</h1>
        <p class="lede">A quiet cursor garden: move through the night and let a lotus bloom beneath your pointer.</p>
        <div class="actions">
          <button class="install" type="button">Install</button>
          <span class="hint">Move the cursor to bloom a lotus</span>
        </div>
      </div>
    </section>
  </main>
  <div id="status" class="status" role="status">Ready to install — lotus included.</div>

  <script src="anti.js" type="module"></script>
</body>
</html>
